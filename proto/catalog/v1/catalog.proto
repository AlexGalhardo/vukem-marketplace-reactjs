syntax = "proto3";

package catalog.v1;

option go_package = "github.com/AlexGalhardo/vukem-micro-mercadolivre-reactjs/gen/catalog/v1;catalogv1";

// CatalogService reads the public catalog: published products of active
// shops. Calls need an API key with the catalog:read scope.
service CatalogService {
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
}

message Product {
  string slug = 1;
  string title = 2;
  int64 price_cents = 3;
  string currency = 4;
  int32 stock = 5;
  string shop_slug = 6;
  string shop_name = 7;
  string category_slug = 8;
  int32 rating_avg_x100 = 9;
  int32 rating_count = 10;
}

message ProductImage {
  string key = 1;
  int32 width = 2;
  int32 height = 3;
  string alt = 4;
}

message ProductDetail {
  Product product = 1;
  string description = 2;
  int32 weight_grams = 3;
  repeated ProductImage images = 4;
}

message PageMeta {
  int32 page = 1;
  int32 per_page = 2;
  int64 total = 3;
  int32 last_page = 4;
}

message ListProductsRequest {
  int32 page = 1;
  int32 per_page = 2;
  string q = 3;
  string category = 4;
  string shop = 5;
  // newest (default), price_asc or price_desc.
  string sort = 6;
}

message ListProductsResponse {
  repeated Product products = 1;
  PageMeta meta = 2;
}

message GetProductRequest {
  string slug = 1;
}

message GetProductResponse {
  ProductDetail product = 1;
}
