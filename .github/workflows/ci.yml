name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  go:
    name: Go (lint, vet, test -race, govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags integration ./...
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool govulncheck ./...

  web:
    name: Web (Biome, tsc, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  docs:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint:md

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  integration:
    name: Integration (Postgres, Redis, Mongo)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketplace" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.10.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      mongo:
        image: mongo:8.3.13
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'" --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/1
      TEST_MONGO_URL: mongodb://localhost:27017/marketplace_test
      # Optional: the Mailtrap email test skips when these secrets are absent.
      MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
      MAILTRAP_SANDBOX_ID: ${{ secrets.MAILTRAP_SANDBOX_ID }}
      SMTP_USERNAME: ${{ secrets.MAILTRAP_SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.MAILTRAP_SMTP_PASSWORD }}
      # Provider sandboxes: each test skips when its secret is absent.
      ABACATEPAY_API_KEY: ${{ secrets.ABACATEPAY_API_KEY }}
      ABACATEPAY_WEBHOOK_SECRET: ${{ secrets.ABACATEPAY_WEBHOOK_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRETS: ${{ secrets.STRIPE_WEBHOOK_SECRETS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    # The Mailtrap free plan has one sandbox shared with other apps: never
    # run two email suites at once.
    concurrency:
      group: mailtrap-sandbox
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -tags integration -race -count=1 ./tests/integration/...

  e2e:
    name: E2E (Playwright on docker compose)
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate APP_KEY
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" > .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300 app
      - name: Seed demo data
        run: docker compose exec -T app /app/app db:seed
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs app
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
